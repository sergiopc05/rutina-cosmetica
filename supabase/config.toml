# Configuración del proyecto para la CLI de Supabase.
# Si tu versión de CLI se queja de campos, ejecuta `supabase init` en otra carpeta
# y copia las secciones que falten.
project_id = "rutina-cosmetica"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[storage]
enabled = true
file_size_limit = "10MiB"

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173", "https://localhost:5173"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = true
# El "enlace mágico" usa la plantilla de Magic Link.

[functions.materialize-notifications]
verify_jwt = true

[functions.dispatch-notifications]
verify_jwt = true

[edge_runtime]
enabled = true
