# Publica la PWA en GitHub Pages en cada push a master.
#
# Requisitos (una sola vez):
#  1. Settings → Pages → Source: "GitHub Actions".
#  2. Settings → Secrets and variables → Actions → New repository secret:
#       VITE_SUPABASE_URL       = https://rskrpczhvefufhewlpyr.supabase.co
#       VITE_SUPABASE_ANON_KEY  = tu clave anon public
#       VITE_VAPID_PUBLIC_KEY   = la que genera `npm run gen:vapid`
#  3. En Supabase → Authentication → URL Configuration añade a Redirect URLs:
#       https://sergiopc05.github.io/rutina-cosmetica/
#
# La app quedará en https://sergiopc05.github.io/rutina-cosmetica/

name: deploy-pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_BASE: /rutina-cosmetica/
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}
          VITE_APP_NAME: Rutina Cosmética
      # Fallback SPA: GitHub Pages sirve 404.html para rutas desconocidas.
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
